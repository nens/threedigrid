name: Linux

# Run on PR requests. And on master itself.
on:
  push:
    branches:
      - master
    paths:
      - 'threedigrid/**.py'
      - './github/workflows/test.yml'
  pull_request:
    paths:  
      - 'threedigrid/**.py'
      - './github/workflows/test.yml'
  workflow_dispatch:

jobs:
  TestLinux:
    name: Python ${{ matrix.python }} ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - display_name: "3.10"
            python: '3.10'
            os: ubuntu-22.04
          - display_name: "3.11"
            python: '3.11'
            os: ubuntu-22.04
          - display_name: "3.12"
            python: '3.12'
            os: ubuntu-22.04
          - display_name: "3.13"
            python: '3.13'
            os: ubuntu-22.04
          - display_name: "3.14"
            python: '3.14'
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install gdal
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev
      
      - name: Install python dependencies
        shell: bash
        run: |
          pip install --disable-pip-version-check --upgrade pip setuptools wheel
          pip install .[geo,results] pytest
          pip install --no-build-isolation --no-cache-dir --force-reinstall GDAL==$(gdal-config --version).*
          pip list

      - name: Run tests
        shell: bash
        run: |
          pytest
